<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso — PréPago Fácil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --blue-primary: #1E40AF;
            --blue-secondary: #2563EB;
            --bg-top: #EAF2FF;
            --bg-middle: #F5F9FF;
            --bg-bottom: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --border: #DCE7F7;
            --card-bg: rgba(255, 255, 255, .98);
            --success: #16A34A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-middle) 45%, var(--bg-bottom) 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(15, 23, 42, .1);
            text-align: center;
        }

        .icon-wrapper {
            width: 90px;
            height: 90px;
            background: #DCFCE7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            color: var(--success);
            font-size: 40px;
            box-shadow: 0 10px 25px rgba(22, 163, 74, 0.2);
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 { font-family: 'Poppins', sans-serif; font-size: 24px; color: var(--text-primary); margin-bottom: 15px; }
        
        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-home {
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 16px;
            background: var(--blue-primary);
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: .2s;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            background: var(--blue-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <i class="fa-solid fa-check"></i>
        </div>
        <h1>Recarga Concluída!</h1>
        <p>Seus pagamentos foram confirmados com sucesso. A recarga já foi enviada para a operadora e o saldo estará disponível no seu aparelho em instantes.</p>
        <a href="/" class="btn-home">
            Voltar ao Início
        </a>
    </div>
</body>
</html>
